# Render shows the paid compute and disk costs before the user deploys.
# The complete native stack does not fit on a 512 MB free instance.
services:
  - type: web
    name: revex
    runtime: docker
    plan: 2c-4g
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    envVars:
      - key: WEB_PORT
        value: 8080
      - key: AI_THREADS
        value: 2
      - key: ENGINE_TOKEN
        generateValue: true
    disk:
      name: revex-data
      mountPath: /app/.revex
      sizeGB: 5

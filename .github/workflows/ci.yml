name: Verify REVEX Solana
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: revex-${{ github.ref }}
  cancel-in-progress: true
jobs:
  application:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
      - run: npm install -g pnpm@11.25.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:web
      - run: pnpm exec tsc --noEmit
      - run: pnpm test
      - run: docker build -t revex-solana .
      - run: |
          docker run -d --name revex-solana -p 8080:8080 revex-solana
          for i in $(seq 1 20); do curl --fail http://127.0.0.1:8080/healthz && exit 0; sleep 1; done
          docker logs revex-solana
          exit 1
